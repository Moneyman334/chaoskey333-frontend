<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChaosKey333 Sigil Spinner Vault</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    .spinner-container {
      margin: 30px 0;
      padding: 30px;
      border: 2px solid #00ffff;
      border-radius: 20px;
      background: rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .spinner-wheel {
      width: 200px;
      height: 200px;
      border: 5px solid #ffd700;
      border-radius: 50%;
      margin: 20px auto;
      position: relative;
      background: conic-gradient(
        from 0deg,
        #ff0000 0deg 72deg,
        #ff8800 72deg 144deg,
        #ffff00 144deg 216deg,
        #00ff00 216deg 288deg,
        #0088ff 288deg 360deg
      );
      transition: transform 3s ease-out;
    }

    .spinner-wheel.spinning {
      animation: spin 3s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .spinner-wheel::after {
      content: '⚡';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .spinner-pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 30px solid #ffffff;
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(1800deg); }
    }

    .chaos-balance {
      font-size: 1.2rem;
      color: #ffd700;
      margin: 10px 0;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .bet-input {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ffff;
      border-radius: 8px;
      color: #ffffff;
      padding: 10px;
      font-size: 1.1rem;
      width: 120px;
      text-align: center;
    }

    .spin-button {
      background: linear-gradient(45deg, #ff6600, #ff0099);
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 15px 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    .spin-button:hover:not(:disabled) {
      background: linear-gradient(45deg, #ff8800, #ff00bb);
      transform: scale(1.05);
    }

    .spin-button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .jackpot-display {
      background: linear-gradient(45deg, #ffd700, #ffaa00);
      color: #000;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      font-weight: bold;
      font-size: 1.2rem;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 5px #ffd700; }
      100% { box-shadow: 0 0 20px #ffd700, 0 0 30px #ffd700; }
    }

    .result-display {
      margin: 20px 0;
      padding: 20px;
      border-radius: 15px;
      font-size: 1.2rem;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-win {
      background: linear-gradient(45deg, #00ff00, #00cc00);
      color: #000;
      animation: celebration 1s ease-in-out;
    }

    .result-jackpot {
      background: linear-gradient(45deg, #ffd700, #ffaa00);
      color: #000;
      animation: jackpotWin 2s ease-in-out;
    }

    .result-lose {
      background: linear-gradient(45deg, #666, #444);
      color: #fff;
    }

    @keyframes celebration {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes jackpotWin {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.2) rotate(-5deg); }
      75% { transform: scale(1.2) rotate(5deg); }
    }

    .pending-spin {
      background: linear-gradient(45deg, #00ffff, #0099ff);
      color: #000;
      animation: pending 1.5s infinite ease-in-out alternate;
    }

    @keyframes pending {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .error-message {
      background: linear-gradient(45deg, #ff3333, #cc0000);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: 300px;
    }

    .vault-btn {
      background: #33ccff;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 15px 25px;
      font-size: 1.1rem;
      margin: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .vault-btn:hover {
      background: #00aaff;
      color: white;
    }

    .mint-status {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #ffcc00;
    }
  </style>
</head>
<body class="vault">
  <div class="resurrection-container">
    <h1 class="glow">⚡ ChaosKey333 Sigil Spinner Vault ⚡</h1>
    
    <!-- Wallet Connection Section -->
    <div style="margin-bottom: 30px;">
      <button id="connectWallet" class="vault-btn" onclick="connectWallet()">🔌 Connect Wallet</button>
      <div id="walletStatus" class="mint-status">🔒 Connect wallet to access spinner</div>
    </div>

    <!-- CHAOS Token Balance & Allowance -->
    <div id="chaosInfo" style="display: none;">
      <div class="chaos-balance" id="chaosBalance">CHAOS Balance: Loading...</div>
      <div class="chaos-balance" id="chaosAllowance">Spinner Allowance: Loading...</div>
      <button id="approveButton" class="vault-btn" onclick="approveChaos()" style="display: none;">🔓 Approve CHAOS for Spinner</button>
    </div>

    <!-- Jackpot Display -->
    <div id="jackpotDisplay" class="jackpot-display" style="display: none;">
      🎰 Current Jackpot: <span id="jackpotAmount">0</span> CHAOS 🎰
    </div>

    <!-- Spinner Interface -->
    <div id="spinnerContainer" class="spinner-container" style="display: none;">
      <div class="spinner-pointer"></div>
      <div id="spinnerWheel" class="spinner-wheel"></div>
      
      <div class="bet-controls">
        <label>Bet Amount:</label>
        <input type="number" id="betAmount" class="bet-input" placeholder="0" step="0.1" min="0">
        <span>CHAOS</span>
      </div>
      
      <button id="spinButton" class="spin-button" onclick="placeBet()">🎰 SPIN THE SIGIL 🎰</button>
      
      <div id="spinnerStatus" class="result-display">
        🎯 Enter bet amount and spin for glory! 🎯
      </div>
    </div>

    <!-- Original Relic Minting Section -->
    <div style="margin-top: 50px; padding-top: 30px; border-top: 2px dashed #666;">
      <h3 style="color: #ffaa00;">🔥 Mint Vault Relic 🔥</h3>
      <button class="vault-btn" onclick="mintRelic()">⚡ Manually Mint Origin Flare Relic</button>
      <div id="mintStatus" class="mint-status">💎 Relic minting available</div>
    </div>
  </div>

  <script>
    // Global variables
    let provider = null;
    let signer = null;
    let userAddress = null;
    let contracts = null;
    let chaosContract = null;
    let spinnerContract = null;
    let currentNetwork = 'baseSepolia';

    // Load contract configurations
    async function loadContracts() {
      try {
        const response = await fetch('/contracts.json');
        contracts = await response.json();
        console.log('📋 Contracts loaded:', contracts);
      } catch (error) {
        console.error('❌ Failed to load contracts:', error);
        showError('Failed to load contract configurations');
      }
    }

    // Connect wallet function
    async function connectWallet() {
      if (!window.ethereum) {
        showError('🦊 MetaMask not detected. Please install MetaMask.');
        return;
      }

      try {
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        
        // Check if we're on the correct network
        const network = await provider.getNetwork();
        if (network.chainId !== contracts[currentNetwork].chainId) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: `0x${contracts[currentNetwork].chainId.toString(16)}` }],
            });
          } catch (switchError) {
            if (switchError.code === 4902) {
              // Network not added, add it
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                  chainId: `0x${contracts[currentNetwork].chainId.toString(16)}`,
                  chainName: currentNetwork === 'baseSepolia' ? 'Base Sepolia' : 'Base Mainnet',
                  nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                  rpcUrls: [contracts[currentNetwork].rpcUrl],
                  blockExplorerUrls: [contracts[currentNetwork].blockExplorer]
                }]
              });
            } else {
              throw switchError;
            }
          }
        }

        // Initialize contracts
        chaosContract = new ethers.Contract(
          contracts[currentNetwork].contracts.chaosToken.address,
          contracts[currentNetwork].contracts.chaosToken.abi,
          signer
        );

        spinnerContract = new ethers.Contract(
          contracts[currentNetwork].contracts.sigilSpinner.address,
          contracts[currentNetwork].contracts.sigilSpinner.abi,
          signer
        );

        // Update UI
        document.getElementById('connectWallet').innerText = `🟢 ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
        document.getElementById('walletStatus').innerText = '✅ Wallet connected successfully';
        document.getElementById('chaosInfo').style.display = 'block';
        document.getElementById('jackpotDisplay').style.display = 'block';
        document.getElementById('spinnerContainer').style.display = 'block';

        // Load user data
        await updateUserData();
        
        console.log('✅ Wallet connected:', userAddress);
      } catch (error) {
        console.error('❌ Wallet connection failed:', error);
        showError('Wallet connection failed: ' + error.message);
      }
    }

    // Update user data (balance, allowance, etc.)
    async function updateUserData() {
      if (!chaosContract || !spinnerContract || !userAddress) return;

      try {
        // Get CHAOS balance
        const balance = await chaosContract.balanceOf(userAddress);
        const decimals = await chaosContract.decimals();
        const balanceFormatted = ethers.utils.formatUnits(balance, decimals);
        document.getElementById('chaosBalance').innerText = `CHAOS Balance: ${parseFloat(balanceFormatted).toFixed(2)} CHAOS`;

        // Get allowance
        const allowance = await chaosContract.allowance(userAddress, contracts[currentNetwork].contracts.sigilSpinner.address);
        const allowanceFormatted = ethers.utils.formatUnits(allowance, decimals);
        document.getElementById('chaosAllowance').innerText = `Spinner Allowance: ${parseFloat(allowanceFormatted).toFixed(2)} CHAOS`;

        // Show approve button if allowance is insufficient
        if (allowance.eq(0)) {
          document.getElementById('approveButton').style.display = 'block';
        } else {
          document.getElementById('approveButton').style.display = 'none';
        }

        // Get current jackpot
        const jackpot = await spinnerContract.getCurrentJackpot();
        const jackpotFormatted = ethers.utils.formatUnits(jackpot, decimals);
        document.getElementById('jackpotAmount').innerText = parseFloat(jackpotFormatted).toFixed(2);

        // Check for pending spins
        const pendingSpin = await spinnerContract.getPendingSpin(userAddress);
        if (pendingSpin.pending) {
          showPendingSpin();
        }

      } catch (error) {
        console.error('❌ Failed to update user data:', error);
        showError('Failed to load user data');
      }
    }

    // Approve CHAOS tokens for spinner contract
    async function approveChaos() {
      if (!chaosContract) return;

      try {
        document.getElementById('approveButton').disabled = true;
        document.getElementById('approveButton').innerText = '⏳ Approving...';

        // Approve a large amount (effectively unlimited)
        const maxAmount = ethers.constants.MaxUint256;
        const tx = await chaosContract.approve(contracts[currentNetwork].contracts.sigilSpinner.address, maxAmount);
        
        showSuccess('🔄 Approval transaction sent. Waiting for confirmation...');
        await tx.wait();
        
        showSuccess('✅ CHAOS tokens approved successfully!');
        await updateUserData();
        
      } catch (error) {
        console.error('❌ Approval failed:', error);
        showError('Approval failed: ' + error.message);
        document.getElementById('approveButton').disabled = false;
        document.getElementById('approveButton').innerText = '🔓 Approve CHAOS for Spinner';
      }
    }

    // Place bet and spin
    async function placeBet() {
      if (!spinnerContract || !userAddress) return;

      const betAmountInput = document.getElementById('betAmount');
      const betAmountValue = betAmountInput.value;

      if (!betAmountValue || parseFloat(betAmountValue) <= 0) {
        showError('Please enter a valid bet amount');
        return;
      }

      try {
        document.getElementById('spinButton').disabled = true;
        document.getElementById('spinButton').innerText = '⏳ Placing Bet...';

        const decimals = await chaosContract.decimals();
        const betAmount = ethers.utils.parseUnits(betAmountValue, decimals);

        // Check allowance
        const allowance = await chaosContract.allowance(userAddress, contracts[currentNetwork].contracts.sigilSpinner.address);
        if (allowance.lt(betAmount)) {
          showError('Insufficient allowance. Please approve more CHAOS tokens.');
          document.getElementById('spinButton').disabled = false;
          document.getElementById('spinButton').innerText = '🎰 SPIN THE SIGIL 🎰';
          return;
        }

        // Place the bet
        const tx = await spinnerContract.spin(betAmount);
        
        // Start spinner animation
        const wheel = document.getElementById('spinnerWheel');
        wheel.classList.add('spinning');
        
        showPendingSpin();
        
        // Wait for transaction confirmation
        await tx.wait();
        
        console.log('🎰 Spin transaction confirmed');
        
        // Listen for the result event
        listenForSpinResult();
        
      } catch (error) {
        console.error('❌ Spin failed:', error);
        showError('Spin failed: ' + error.message);
        document.getElementById('spinButton').disabled = false;
        document.getElementById('spinButton').innerText = '🎰 SPIN THE SIGIL 🎰';
        
        const wheel = document.getElementById('spinnerWheel');
        wheel.classList.remove('spinning');
      }
    }

    // Show pending spin state
    function showPendingSpin() {
      document.getElementById('spinnerStatus').className = 'result-display pending-spin';
      document.getElementById('spinnerStatus').innerText = '⏳ Awaiting Chainlink VRF result...';
      document.getElementById('spinButton').disabled = true;
      document.getElementById('spinButton').innerText = '⏳ Spinning...';
    }

    // Listen for spin result events
    function listenForSpinResult() {
      const filter = spinnerContract.filters.SpinResult(userAddress);
      
      spinnerContract.once(filter, (user, requestId, result, payout, jackpot, event) => {
        handleSpinResult(result, payout, jackpot);
      });

      // Timeout after 5 minutes
      setTimeout(() => {
        // Check if still pending
        const statusElement = document.getElementById('spinnerStatus');
        if (statusElement.classList.contains('pending-spin')) {
          showError('⏰ Spin result timeout. Please check your transaction status.');
          resetSpinner();
        }
      }, 300000); // 5 minutes
    }

    // Handle spin result
    function handleSpinResult(result, payout, jackpot) {
      const wheel = document.getElementById('spinnerWheel');
      wheel.classList.remove('spinning');
      
      const payoutFormatted = ethers.utils.formatUnits(payout, 18);
      
      if (jackpot) {
        // Jackpot win!
        document.getElementById('spinnerStatus').className = 'result-display result-jackpot';
        document.getElementById('spinnerStatus').innerText = `🎉 JACKPOT! 🎉 You won ${parseFloat(payoutFormatted).toFixed(2)} CHAOS!`;
        
        // Confetti animation
        confetti({
          particleCount: 200,
          spread: 70,
          origin: { y: 0.6 }
        });
        
        // Multiple confetti bursts
        setTimeout(() => confetti({
          particleCount: 100,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        }), 250);
        
        setTimeout(() => confetti({
          particleCount: 100,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        }), 500);
        
      } else if (payout.gt(0)) {
        // Regular win
        document.getElementById('spinnerStatus').className = 'result-display result-win';
        document.getElementById('spinnerStatus').innerText = `🎊 You won ${parseFloat(payoutFormatted).toFixed(2)} CHAOS! 🎊`;
        
        // Single confetti burst
        confetti({
          particleCount: 100,
          spread: 50,
          origin: { y: 0.7 }
        });
      } else {
        // Loss
        document.getElementById('spinnerStatus').className = 'result-display result-lose';
        document.getElementById('spinnerStatus').innerText = '💀 Better luck next time! 💀';
      }
      
      // Update user data
      setTimeout(() => {
        updateUserData();
        resetSpinner();
      }, 5000);
    }

    // Reset spinner to ready state
    function resetSpinner() {
      document.getElementById('spinButton').disabled = false;
      document.getElementById('spinButton').innerText = '🎰 SPIN THE SIGIL 🎰';
      document.getElementById('betAmount').value = '';
      
      setTimeout(() => {
        document.getElementById('spinnerStatus').className = 'result-display';
        document.getElementById('spinnerStatus').innerText = '🎯 Enter bet amount and spin for glory! 🎯';
      }, 2000);
    }

    // Utility functions
    function showError(message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message';
      errorDiv.innerText = message;
      document.body.appendChild(errorDiv);
      
      setTimeout(() => {
        errorDiv.remove();
      }, 5000);
    }

    function showSuccess(message) {
      document.getElementById('walletStatus').innerText = message;
      document.getElementById('walletStatus').style.color = '#00ff00';
      
      setTimeout(() => {
        document.getElementById('walletStatus').style.color = '';
      }, 3000);
    }

    // Original mint relic function
    async function mintRelic() {
      try {
        const contractAddress = "0x11AaC98400AB700549233C4571B679b879Ba9f3a";
        const abi = [
          {
            "inputs": [],
            "name": "mintRelic",
            "outputs": [],
            "stateMutability": "nonpayable",
            "type": "function"
          }
        ];

        if (!window.ethereum) {
          alert("⚠️ MetaMask not detected. Please install it to mint.");
          return;
        }

        await ethereum.request({ method: 'eth_requestAccounts' });

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        const contract = new ethers.Contract(contractAddress, abi, signer);

        const tx = await contract.mintRelic();
        await tx.wait();

        alert("🔥 Origin Flare Relic minted successfully! You're now encoded in Syndicate history.");
      } catch (err) {
        console.error("❌ Minting error:", err);
        alert("Mint failed. Please check your wallet connection and try again.");
      }
    }

    // Initialize on page load
    window.onload = async function () {
      console.log('🚀 Initializing ChaosKey333 Sigil Spinner Vault...');
      await loadContracts();
      
      // Auto-connect wallet if already connected
      if (window.ethereum && window.ethereum.selectedAddress) {
        connectWallet();
      }
    };
  </script>
</body>
</html>
