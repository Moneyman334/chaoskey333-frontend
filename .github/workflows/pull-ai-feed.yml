name: Pull AI Feed
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch feed
        env:
          FEED_ENDPOINT: ${{ secrets.AI_FEED_ENDPOINT }}
          STATS_ENDPOINT: ${{ secrets.AI_STATS_ENDPOINT }}
        run: |
          mkdir -p data
          if [ -z "$FEED_ENDPOINT" ] || [ -z "$STATS_ENDPOINT" ]; then
            echo "No endpoints configured; keeping placeholders.";
          else
            curl -fsSL "$FEED_ENDPOINT"  -o data/ai-feed.json
            curl -fsSL "$STATS_ENDPOINT" -o data/ai-stats.json
            jq -r '.' data/ai-feed.json  >/dev/null
            jq -r '.' data/ai-stats.json >/dev/null
          fi
      - name: Commit updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-*.json || true
          git diff --cached --quiet || git commit -m "chore(ai): refresh live feed"
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push